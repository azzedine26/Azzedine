<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ostad DZ - أستاذ ديزاد</title>
    <meta name="description" content="تطبيق ويب تقدمي (PWA) بدون إنترنت مخصص للأساتذة في الجزائر لإدارة الأقسام والطلاب والحضور والغياب والجدول الأسبوعي وتحضير الدروس ورصد النقاط والمعدلات ومكتبة الدروس والملفات والتذكيرات وإنشاء وطباعة الوثائق والتقارير المدرسية الرسمية." />
    
    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#006233" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ostad DZ" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ostad DZ - أستاذ ديزاد" />
    <meta property="og:description" content="تطبيق ويب تقدمي (PWA) بدون إنترنت مخصص للأساتذة في الجزائر لإدارة الأقسام والطلاب والحضور والغياب والجدول الأسبوعي وتحضير الدروس ورصد النقاط والمعدلات ومكتبة الدروس والملفات والتذكيرات وإنشاء وطباعة الوثائق والتقارير المدرسية الرسمية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Typography: Cairo Arabic Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- Instant Theme Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ostad_dz_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

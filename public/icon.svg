<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006233" />
      <stop offset="100%" stop-color="#004D25" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Center Emblem Group with shadow -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Open Book Pages -->
    <path d="M256 360 C 210 330 140 330 90 345 L 90 200 C 140 185 210 185 256 215 C 302 185 372 185 422 200 L 422 345 C 372 330 302 330 256 360 Z" fill="#FFFFFF" />
    <!-- Book spine highlight & pages shading -->
    <path d="M256 215 L 256 360" stroke="#006233" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 230 C 160 220 210 220 240 240" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 260 C 160 250 210 250 240 270" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 290 C 160 280 210 280 240 300" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 230 C 352 220 302 220 272 240" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 260 C 352 250 302 250 272 270" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 290 C 352 280 302 280 272 300" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Teacher Graduation Cap / Mortarboard -->
    <polygon points="256,110 370,160 256,205 142,160" fill="url(#goldGrad)" />
    <!-- Cap base -->
    <path d="M185 180 L 185 220 C 185 235 256 250 256 250 C 256 250 327 235 327 220 L 327 180" fill="#D97706" />
    <!-- Tassel -->
    <path d="M340 170 C 355 190 365 210 365 235" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <circle cx="365" cy="240" r="8" fill="url(#redGrad)" />
  </g>

  <!-- Algerian Red Star and Crescent Accent -->
  <g transform="translate(256, 390) scale(0.7)">
    <circle cx="0" cy="0" r="36" fill="url(#redGrad)" />
    <circle cx="10" cy="0" r="28" fill="#004D25" />
    <!-- Star -->
    <polygon points="12,-15 17,-3 29,-3 20,6 23,18 12,11 2,18 5,6 -4,-3 8,-3" fill="url(#redGrad)" />
  </g>

  <!-- Ostad DZ Arabic Typography -->
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">OSTAD DZ • أستاذ</text>
</svg>
